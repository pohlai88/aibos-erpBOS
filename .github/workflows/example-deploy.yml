# Example GitHub Actions Workflow with Secrets
# This is a template showing how to use GitHub Secrets in workflows
# Copy and modify this for your actual deployment needs

name: Example Deploy Workflow

on:
  workflow_dispatch: # Manual trigger only - remove to enable automatic deployments
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint || true # Continue on linting errors for now

      - name: Build packages
        env:
          # Database connection - Required for build-time queries
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Application URLs
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
        run: pnpm build

      - name: Run tests
        env:
          # Test database connection
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Secrets for testing
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          # Email configuration
          RECEIPTS_FROM_EMAIL: ${{ secrets.RECEIPTS_FROM_EMAIL }}
        run: pnpm test || true # Continue on test failures for now

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    environment: staging # Use staging environment secrets
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        env:
          # All secrets from staging environment
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          RECEIPTS_FROM_EMAIL: ${{ secrets.RECEIPTS_FROM_EMAIL }}
          PAY_GATEWAY: ${{ secrets.PAY_GATEWAY }}
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment: production # Use production environment secrets (requires approval)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
        run: NODE_ENV=production pnpm build

      - name: Deploy to Production
        env:
          # Production secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ADYEN_API_KEY: ${{ secrets.ADYEN_API_KEY }}
          ADYEN_HMAC_KEY: ${{ secrets.ADYEN_HMAC_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          RECEIPTS_FROM_EMAIL: ${{ secrets.RECEIPTS_FROM_EMAIL }}
          PAY_GATEWAY: ${{ secrets.PAY_GATEWAY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying to production..."
          # Example: Deploy to Vercel
          # npx vercel deploy --prod --token=$VERCEL_TOKEN

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' # Only run on manual trigger
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/bff/Dockerfile
          push: true
          tags: aibos/erp-bff:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Docker environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Docker image built and pushed successfully"
          # Add deployment commands for Docker-based infrastructure
